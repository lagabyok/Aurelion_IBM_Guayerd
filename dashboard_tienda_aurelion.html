<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tienda Aurelion - Dashboard Interactivo</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; background-color: #FFE3E3; color: #333; margin: 0; padding: 0; }
  h1 { background-color: #F24141; color: white; padding: 20px; text-align: center; margin: 0; }
  button { margin: 10px; padding: 10px 20px; background-color: #F27979; border: none; color: white; cursor: pointer; border-radius: 5px; }
  button:hover { background-color: #E74B3C; }
  .chart-container {
  display: none;
  margin: 20px auto; /* centrado horizontal automático */
  border: 2px solid #F24141;
  padding: 10px;
  border-radius: 8px;
  background-color: white;
  width: 80%; /* opcional: ajusta ancho del gráfico */
  max-width: 800px; /* opcional: limita el ancho máximo */
  text-align: center; /* centrado interno */
}

</style>
</head>
<body>

<h1>🛒 Tienda Aurelion - Dashboard Interactivo</h1>

<div style="text-align:center;">
  <button onclick="toggleChart('cat')">Ventas por Categoría</button>
  <button onclick="toggleChart('pago')">Ventas por Medio de Pago</button>
  <button onclick="toggleChart('ciudad')">Top 5 Ciudades</button>
  <button onclick="toggleChart('cliente')">Top 5 Clientes</button>
</div>

<!-- Contenedores de gráficos -->
<div id="cat" class="chart-container"></div>
<div id="pago" class="chart-container"></div>
<div id="ciudad" class="chart-container"></div>
<div id="cliente" class="chart-container"></div>

<script>
// Función para alternar la visibilidad de gráficos
function toggleChart(chartId) {
  const charts = document.querySelectorAll('.chart-container');
  charts.forEach(chart => {
    chart.style.display = chart.id === chartId ? 'block' : 'none';
  });
}

// Datos de ejemplo para cada gráfico
// Ventas por Categoría
Plotly.newPlot('cat', [
  { x: ['Alimentos'], y: [1215136], type: 'bar', name: 'Alimentos', marker: {color: '#F24141'} },
  { x: ['Limpieza'], y: [1436281], type: 'bar', name: 'Limpieza', marker: {color: '#F27979'} }
], { title: 'Ventas por Categoría', barmode: 'relative' });

// Ventas por Medio de Pago
Plotly.newPlot('pago', [
  { x: ['efectivo'], y: [934819], type: 'bar', name: 'Efectivo', marker: {color: '#E74B3C'} },
  { x: ['qr'], y: [714280], type: 'bar', name: 'QR', marker: {color: '#F24141'} },
  { x: ['tarjeta'], y: [460099], type: 'bar', name: 'Tarjeta', marker: {color: '#F27979'} },
  { x: ['transferencia'], y: [542219], type: 'bar', name: 'Transferencia', marker: {color: '#CBC8CB'} }
], { title: 'Ventas por Medio de Pago', barmode: 'relative' });

// Top 5 Ciudades
Plotly.newPlot('ciudad', [
  { x: ['Rio Cuarto'], y: [792203], type: 'bar', name: 'Rio Cuarto', marker: {color: '#F24141'} },
  { x: ['Alta Gracia'], y: [481504], type: 'bar', name: 'Alta Gracia', marker: {color: '#F27979'} },
  { x: ['Cordoba'], y: [481482], type: 'bar', name: 'Cordoba', marker: {color: '#E74B3C'} },
  { x: ['Carlos Paz'], y: [353852], type: 'bar', name: 'Carlos Paz', marker: {color: '#CBC8CB'} },
  { x: ['Villa Maria'], y: [313350], type: 'bar', name: 'Villa Maria', marker: {color: '#FFE3E3'} }
], { title: 'Top 5 Ciudades', barmode: 'relative' });

// Top 5 Clientes (ejemplo)
Plotly.newPlot('cliente', [
  { x: ['Cliente A'], y: [300000], type: 'bar', name: 'Cliente A', marker: {color: '#F24141'} },
  { x: ['Cliente B'], y: [250000], type: 'bar', name: 'Cliente B', marker: {color: '#F27979'} },
  { x: ['Cliente C'], y: [200000], type: 'bar', name: 'Cliente C', marker: {color: '#E74B3C'} },
  { x: ['Cliente D'], y: [150000], type: 'bar', name: 'Cliente D', marker: {color: '#CBC8CB'} },
  { x: ['Cliente E'], y: [100000], type: 'bar', name: 'Cliente E', marker: {color: '#FFE3E3'} }
], { title: 'Top 5 Clientes', barmode: 'relative' });
</script>
<footer style="background-color:#F24141; color:white; text-align:center; padding:15px; position:fixed; bottom:0; width:100%;">
  © 2025 Tienda Aurelion. Gabriela Coronel-Todos los derechos reservados.
</footer>


</body>
</html>
